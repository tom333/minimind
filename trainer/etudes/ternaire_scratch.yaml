# Test B des poids ternaires : modèle ternaire (−1/0/+1, échelle par ligne) entraîné DEPUIS ZÉRO sur
# une epoch complète (332M tokens), même recette et même seed que le full run.
# Repères : modèle 16 bits au même budget 2.006 ; meilleur modèle converti après coup (QAT 150M) 2.163.
name: ternaire-scratch
sampler: grid
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  epochs: 1
  seed: 42
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 1000
  log_interval: 100
  save_interval: 4000
space:
  ternary: [row]
