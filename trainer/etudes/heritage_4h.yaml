# Héritage, essai de quatre heures : même enfant et même recette, budget encore doublé (240M tokens).
# Question : jusqu'où descend l'enfant hérité, et le gain par doublement (≈ 0,04 bit/octet) se maintient-il ?
# Repères en bits par octet, 71M long (1 Md de tokens, ~8 h) / enfant à 2 h : web français sélectionné 1,070 / 1,061 ;
# web français courant 1,203 / 1,193 ; Wikipédia 0,583 / 0,531 ; Wikisource 1,212 / 1,196 ; anglais 1,120 / 1,055.
# Courbe de l'enfant sur le web sélectionné : 1,154 (29 min), 1,103 (58 min), 1,061 (2 h).
name: heritage-4h
sampler: grid
data_file: fr_en/pretrain_fr65hq_q3.jsonl
tokenizer_subdir: fr_en/tokenizer_q3_24k
from_subdir: heritage
base:
  optimizer: muon
  muon_lr: 0.003
  learning_rate: 2e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 16
  accumulation_steps: 4
  max_tokens: 240000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 4000
  log_interval: 100
  seed: 42
  hidden_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 3072
space:
  variante:
    herite-4h: {from_weight: q3-06-b8}
