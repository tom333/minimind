# Variante du corpus : web français sélectionné sur sa qualité (FineWeb2-HQ, score >= 0,5) à la place du
# web courant. Même tokenizer, même recette, même budget (50M tokens) que fr_en_court.yaml.
# Comparaison sur les jeux de test communs (trainer/eval_cross.py), pas sur la val_loss de chaque corpus.
name: fr-en-hq-court
sampler: grid
data_file: fr_en/pretrain_fr65hq.jsonl
tokenizer_subdir: fr_en/tokenizer_fr65_16k
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  max_tokens: 50000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 250
  log_interval: 50
space:
  seed: [42]
