# Enfant en boucle (Loop Transformer, à la GLM-5.4) : l'enfant taillé à 8 blocs a perdu la profondeur du parent (28),
# et avec elle le raisonnement (compréhension de texte au hasard, contre 56,6 % pour le parent). On lui rend de la
# profondeur SANS paramètre de plus : ses blocs 2 à 5 (parent : 3, 18, 20, 21) sont exécutés deux fois, chaque
# passage dosé par une porte par token. Profondeur effective 12, mêmes 150M paramètres, ~1,5 fois plus de calcul.
# Repère de profondeur : un enfant à 12 blocs DISTINCTS (213M paramètres), choisis dans l'ordre glouton. 10M tokens,
# même recette que l'étude heritage-dissection, dont l'enfant intact à 8 blocs fait 3,257.
name: heritage-boucle
sampler: grid
data_file: fr_en/pretrain_fr65hq_q3.jsonl
tokenizer_subdir: fr_en/tokenizer_q3_24k
from_subdir: heritage
base:
  muon_lr: 0.003
  learning_rate: 2e-4
  optimizer: muon
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 16
  accumulation_steps: 4
  max_tokens: 10000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 0
  eval_interval: 500
  log_interval: 100
  seed: 42
  hidden_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 3072
space:
  variante:
    boucle: {from_weight: q3-06-b8, loop_layers: "2,5", loop_count: 2}
    profond-12: {from_weight: q3-06-b12, num_hidden_layers: 12}
