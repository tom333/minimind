# Seconde graine pour confirmer le gain « plus profond » : référence et 10 blocs × FFN 1792 avec la graine 43.
# Graine 42 : référence 3.462, 10 blocs 3.447 (−0,015, à la limite du bruit de 0.012).
name: graines
sampler: grid
data_file: fr_en/pretrain_fr65.jsonl
tokenizer_subdir: fr_en/tokenizer_fr65_16k
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  max_tokens: 50000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 250
  log_interval: 50
  seed: 42
space:
  variante:
    reference-g43: {seed: 43}
    dix-blocs-g43: {seed: 43, num_hidden_layers: 10, intermediate_size: 1792}
