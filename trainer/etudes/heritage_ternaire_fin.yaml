# Héritage, puis ternaire en fin d'entraînement : l'enfant hérité (Qwen3-0.6B taillé à 8 blocs) apprend d'abord en
# 16 bits, là où l'héritage paie le plus, puis ses blocs passent progressivement en −1/0/+1 (rampe), et finissent
# l'entraînement en ternaire. 10M tokens par essai. Bascule à mi-parcours ou aux quatre cinquièmes ; un ternaire
# apprend mieux avec un taux d'apprentissage doublé (étude 16).
# Repères (même vocabulaire, même budget) : 16 bits hérité 3,257 ; ternaire hérité dès le départ 3,930 ;
# ternaire parti de zéro 4,030. Le modèle final est ternaire dans tous les essais ci-dessous.
name: heritage-ternaire-fin
sampler: grid
data_file: fr_en/pretrain_fr65hq_q3.jsonl
tokenizer_subdir: fr_en/tokenizer_q3_24k
from_subdir: heritage
base:
  ternary: row
  optimizer: muon
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 16
  accumulation_steps: 4
  max_tokens: 10000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 0
  eval_interval: 500
  log_interval: 100
  seed: 42
  hidden_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 3072
  from_weight: q3-06-b8
  ternary_ramp: 0.05
space:
  variante:
    bascule-50: {ternary_start: 0.5, muon_lr: 0.003, learning_rate: 2e-4}
    bascule-50-lr06: {ternary_start: 0.5, muon_lr: 0.006, learning_rate: 4e-4}
    bascule-80-lr06: {ternary_start: 0.8, muon_lr: 0.006, learning_rate: 4e-4}
