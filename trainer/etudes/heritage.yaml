# Héritage : un enfant de 150M taillé dans Qwen3-0.6B-Base (trainer/heritage.py : vocabulaire réduit à 24 000 tokens
# utiles à notre corpus, 8 blocs gardés sur 28), réparé par un entraînement court, contre le MÊME modèle parti de
# poids aléatoires, avec le même vocabulaire, les mêmes données et le même nombre de pas (donc le même temps).
# Avant réparation, l'enfant ne vaut rien : loss 9,40 pour un hasard de 10,09 (blocs choisis un à un, en retirant
# à chaque tour celui qui gêne le moins). Le tokenizer n'est pas le nôtre : les loss ne se comparent qu'entre ces
# essais ; la comparaison avec nos autres modèles se fait en bits par octet (eval_cross.py).
# Deux taux d'apprentissage pour l'enfant : le nôtre (qui peut effacer l'héritage) et un taux réduit à 30 %.
# Lot de 16 cumulé 4 fois (lot global de 64) : avec 24 000 tokens de vocabulaire, un lot de 32 dépasse les 12 Go.
name: heritage
sampler: grid
data_file: fr_en/pretrain_fr65hq_q3.jsonl
tokenizer_subdir: fr_en/tokenizer_q3_24k
from_subdir: heritage
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 16
  accumulation_steps: 4
  max_tokens: 30000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 250
  log_interval: 50
  seed: 42
  hidden_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 3072
space:
  variante:
    herite: {from_weight: q3-06-b8}
    zero: {}
    herite-lr03: {from_weight: q3-06-b8, muon_lr: 0.003, learning_rate: 2e-4}
