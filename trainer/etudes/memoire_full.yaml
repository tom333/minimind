# Couche mémoire sur une epoch complète (332M tokens) : à 50M tokens le modèle est limité par les
# données, pas par sa capacité, donc un ajout de capacité ne peut pas s'y voir (étude `memoire` : 0 gain).
# Repère sans mémoire, même recette, même seed, même budget (full run) :
#   val_loss 2.010, précision 55.2 %, tokens rares 2.804.
name: memoire-full
sampler: grid
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  epochs: 1
  seed: 42
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 1000
  log_interval: 100
  save_interval: 4000
  memory_layers: "4"
space:
  memory_lr_ratio: [10]
