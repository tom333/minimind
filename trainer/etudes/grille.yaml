# Grilles 3D à la place du FFN (model/grid.py) : le savoir de chaque bloc est rangé dans des grilles que le token
# lit à une position calculée par le modèle, au lieu de traverser trois grandes matrices. 16 grilles par bloc, de
# 4 à 32 cases par côté, 8 nombres par case : 5,2M de paramètres par bloc (FFN : 5,6M).
# Les grilles sont apprises 10 fois plus vite que le reste (accès épars, comme en image de synthèse).
# Repère sans grilles, même recette et même graine : 3,462 en 27 min (36 600 tokens/s). Bruit : 0,012.
name: grille
sampler: grid
data_file: fr_en/pretrain_fr65.jsonl
tokenizer_subdir: fr_en/tokenizer_fr65_16k
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  max_tokens: 50000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 250
  log_interval: 50
  seed: 42
  memory_lr_ratio: 10
space:
  variante:
    grilles-partout: {grid_layers: "0,1,2,3,4,5,6,7"}
    grilles-un-bloc-sur-deux: {grid_layers: "1,3,5,7"}
