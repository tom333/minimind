# Grille : learning rate de Muon x seed, sur la recette de référence (50M tokens).
# Repères connus : muon_lr 0.01 → val_loss 2.347 (seed 42) / 2.340 (seed 2).
name: muon-lr
sampler: grid
base:
  optimizer: muon
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  max_tokens: 50000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 250
  log_interval: 50
space:
  muon_lr: [0.005, 0.01, 0.02]
  seed: [42, 2]
