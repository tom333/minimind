# FFN à matrices structurées (BTT) : mêmes paramètres et même calcul théorique que le FFN plein,
# largeur interne x2. Batch 16 x 4 : les activations BTT sont bien plus grosses que celles du FFN plein
# (9,4 Go à batch 16 contre 3,8 Go ; batch 32 déborde des 12 Go ; btt4x ne tient pas du tout).
# Mesuré : 2,4x plus lent que le FFN plein au même batch. Repères FFN plein, même batch effectif : val_loss 2.347 (seed 42) / 2.340 (seed 2).
name: btt-b16
sampler: grid
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 16
  accumulation_steps: 4
  max_tokens: 50000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 1000
  log_interval: 200
space:
  variante:
    btt2x: {ffn_btt_rank: 9, ffn_btt_mid: "76,64"}
