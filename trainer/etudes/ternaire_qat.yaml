# Test A des poids ternaires (−1/0/+1) : on part du modèle du full run et on le réentraîne 50M tokens
# en calculant avec les poids arrondis (QAT). Repères, val_loss sur le même jeu :
#   modèle d'origine 16 bits : 2.006 ; arrondi ternaire brut sans réentraînement : 5.65 (matrix) / 5.54 (row).
name: ternaire-qat
sampler: grid
from_subdir: full
base:
  from_weight: pretrain
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  max_tokens: 50000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 250
  log_interval: 50
space:
  ternary: [matrix, row]
