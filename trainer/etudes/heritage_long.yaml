# Héritage, essai d'une heure : même enfant (Qwen3-0.6B taillé à 8 blocs) et même recette que le meilleur essai de
# l'étude heritage (taux d'apprentissage réduit à 30 %), budget doublé : 60M tokens, environ 1 h d'entraînement.
# Question : en une heure, l'enfant hérité passe-t-il sous notre 71M entraîné sur 1 Md de tokens (~8 h) ?
# Repères en bits par octet (eval_cross.py), 71M long / enfant à 29 min : web français sélectionné 1,070 / 1,154 ;
# web français courant 1,203 / 1,290 ; Wikipédia 0,583 / 0,685 ; Wikisource 1,212 / 1,296 ; anglais 1,120 / 1,123.
# Repère de loss (tokens Qwen, non comparable à nos autres études) : 2,98 à 30M tokens.
name: heritage-long
sampler: grid
data_file: fr_en/pretrain_fr65hq_q3.jsonl
tokenizer_subdir: fr_en/tokenizer_q3_24k
from_subdir: heritage
base:
  optimizer: muon
  muon_lr: 0.003
  learning_rate: 2e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 16
  accumulation_steps: 4
  max_tokens: 60000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 1000
  log_interval: 100
  seed: 42
  hidden_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 3072
space:
  variante:
    herite-1h: {from_weight: q3-06-b8}
