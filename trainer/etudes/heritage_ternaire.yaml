# Héritage en ternaire : le câblage hérité suffit-il pour obtenir vite un modèle à poids −1/0/+1 ?
# La dissection a montré que les signes seuls des poids hérités gardent au moins 40 % du bénéfice de l'héritage.
# Ici, les blocs de l'enfant (Qwen3-0.6B taillé à 8 blocs) sont ternaires PENDANT tout l'entraînement (échelle par
# ligne, étude 16) : au départ, le calcul vu par le modèle est exactement la variante « signes » ; l'optimiseur garde
# en plus les valeurs précises héritées comme poids latents. 10M tokens par essai.
# Repères (même vocabulaire, même budget) : 16 bits hérité 3,257 ; signes seuls en 16 bits 3,764 ;
# 16 bits partant de zéro 4,103. Un ternaire partant de zéro demande un taux d'apprentissage doublé (étude 16).
name: heritage-ternaire
sampler: grid
data_file: fr_en/pretrain_fr65hq_q3.jsonl
tokenizer_subdir: fr_en/tokenizer_q3_24k
from_subdir: heritage
base:
  ternary: row
  optimizer: muon
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 16
  accumulation_steps: 4
  max_tokens: 10000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 0
  eval_interval: 500
  log_interval: 100
  seed: 42
  hidden_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 3072
space:
  variante:
    herite-lr03: {from_weight: q3-06-b8, muon_lr: 0.003, learning_rate: 2e-4}
    herite-lr06: {from_weight: q3-06-b8, muon_lr: 0.006, learning_rate: 4e-4}
    zero-lr2: {muon_lr: 0.02, learning_rate: 1.4e-3}
