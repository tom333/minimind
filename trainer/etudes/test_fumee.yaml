# Test de fumée de la chaîne Dagster → pod GPU → Optuna → MLflow (2 essais d'environ 30 s).
name: test-fumee
sampler: grid
base:
  optimizer: muon
  hidden_size: 256
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  batch_size: 32
  max_tokens: 435200
  packing: 1
  use_compile: 0
  save_resume: 0
  eval_interval: 20
  log_interval: 10
space:
  muon_lr: [0.01, 0.02]
