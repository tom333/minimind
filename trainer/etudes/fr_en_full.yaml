# Pretrain bilingue complet : 1 epoch du corpus fr65 (~1,02 milliard de tokens, ~7 h).
name: fr-en-full
sampler: grid
data_file: fr_en/pretrain_fr65.jsonl
tokenizer_subdir: fr_en/tokenizer_fr65_16k
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  epochs: 1
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 2000
  log_interval: 200
  save_interval: 4000
space:
  seed: [42]
