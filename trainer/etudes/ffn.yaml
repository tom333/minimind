# Variantes du FFN (59 % du temps d'un pas) sur le corpus bilingue, budget court (50M tokens).
# Référence : fr-en-court (SwiGLU 768 → 2432, 8 blocs, 71,3M) = val_loss 3.462 (fr 3.297, en 3.763), même
# recette et même graine. Bruit : 0.012. Critères : val_loss, temps par pas, mémoire.
name: ffn
sampler: grid
data_file: fr_en/pretrain_fr65.jsonl
tokenizer_subdir: fr_en/tokenizer_fr65_16k
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  max_tokens: 50000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 250
  log_interval: 50
  seed: 42
space:
  variante:
    relu2-meme-largeur: {ffn_glu: 0, hidden_act: relu2}                           # 56,3M : FFN −33 % de calcul
    relu2-memes-params: {ffn_glu: 0, hidden_act: relu2, intermediate_size: 3648}  # 71,3M
    profond-etroit: {num_hidden_layers: 10, intermediate_size: 1792}               # 71,3M : 10 blocs
