# Poids ternaires, phase 1b : jusqu'où monter le taux d'apprentissage ? (50M tokens, 71M, échelle par ligne)
# Phase 1 : recette 16 bits (Muon 0.01 / AdamW 7e-4) = 3.593 ; ×2 = 3.562 (gain réel, bruit 0.012).
# Référence 16 bits au même budget : 3.462.
name: ternaire-lr
sampler: grid
data_file: fr_en/pretrain_fr65.jsonl
tokenizer_subdir: fr_en/tokenizer_fr65_16k
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  max_tokens: 50000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 250
  log_interval: 50
  seed: 42
  ternary: row
space:
  variante:
    x3: {muon_lr: 0.03, learning_rate: 2.1e-3}
    x4: {muon_lr: 0.04, learning_rate: 2.8e-3}
