# Héritage avec réduction de LARGEUR (trainer/heritage_largeur.py) : l'enfant est taillé dans Qwen3-1.7B-Base,
# deux fois plus large que Qwen3-0.6B (2 048 contre 1 024) : rotation du flux résiduel vers ses directions
# principales, moitié des dimensions et moitié des neurones de FFN gardées, mêmes 8 blocs. L'enfant a exactement la
# forme de q3-06-b8 (taillé dans Qwen3-0.6B, sans réduction de largeur) : seul le parent change.
# Question : un parent plus gros, réduit en largeur, transmet-il plus qu'un parent déjà à la bonne largeur ?
# C'est la coupe qu'il faudra pour hériter d'un parent beaucoup plus gros. 10M tokens par essai.
# Repères (même vocabulaire, même budget) : enfant de Qwen3-0.6B 3,257 (taux réduit) / 3,289 (taux habituel) ;
# départ de zéro 4,103.
name: heritage-largeur
sampler: grid
data_file: fr_en/pretrain_fr65hq_q3.jsonl
tokenizer_subdir: fr_en/tokenizer_q3_24k
from_subdir: heritage
base:
  from_weight: q3-17-l8
  optimizer: muon
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 16
  accumulation_steps: 4
  max_tokens: 10000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 0
  eval_interval: 500
  log_interval: 100
  seed: 42
  hidden_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  intermediate_size: 3072
space:
  variante:
    taux-reduit: {muon_lr: 0.003, learning_rate: 2e-4}
    taux-habituel: {muon_lr: 0.01, learning_rate: 7e-4}
