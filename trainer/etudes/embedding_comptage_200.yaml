# Embedding rempli par le calcul (comptage + SVD, trainer/embedding_comptage.py), budget quadruplé : 200M tokens.
# À 50M tokens, il a donné 3,380 contre 3,462 pour l'embedding aléatoire (−0,082, sept fois le bruit), avec une
# avance stable dès les deux tiers de l'essai. Question : l'avance tient-elle sur un essai plus long ?
# Repère, même recette avec un embedding aléatoire à 200M tokens : 3,120 (français 2,969, anglais 3,394), 96 min.
name: embedding-comptage-200
sampler: grid
data_file: fr_en/pretrain_fr65.jsonl
tokenizer_subdir: fr_en/tokenizer_fr65_16k
from_subdir: heritage
base:
  optimizer: muon
  muon_lr: 0.01
  learning_rate: 7e-4
  warmup_ratio: 0.02
  weight_decay: 0.1
  batch_size: 64
  accumulation_steps: 1
  max_tokens: 200000000
  packing: 1
  use_compile: 1
  save_resume: 0
  detailed_eval: 1
  eval_interval: 1000
  log_interval: 200
  seed: 42
space:
  variante:
    comptage: {from_weight: emb-comptage}
